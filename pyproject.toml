[project]
name = "geoguessr-ai"
version = "0.1.0"
description = "Predicting the country of street-level photos with CLIP and fine-tuning"
readme = "README.md"
authors = [
    { name = "Mete Cem Bulut", email = "metecem22@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "huggingface-hub>=0.24",
    "matplotlib>=3.8",
    "pandas>=2.2",
    "pillow>=10",
    "pycountry>=24.6",
]

[project.optional-dependencies]
ml = [
    "torch",
    "transformers",
]
onnx = [
    "onnx>=1.23.2",
    "onnxruntime>=1.31.1",
    "onnxscript>=0.7.2",
]

[dependency-groups]
browser = [
    "playwright>=1.64.1",
]
dev = [
    "nodejs-wheel-binaries>=24.19.0",
    "pandas-stubs~=3.1.0",
    "pytest>=9.2.0",
    "ruff==0.17.3",
]

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[tool.ruff]
# app/ is the Gradio Space; its local `inference` module is first-party
src = ["src", "app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
