[project]
name = "geoguessr-ai"
version = "0.1.0"
description = "Predicting the country of street-level photos with CLIP and fine-tuning"
readme = "README.md"
authors = [
    { name = "Mete Cem Bulut", email = "metecem22@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "huggingface-hub>=0.24",
    "matplotlib>=3.8",
    "pandas>=2.2",
    "pillow>=10",
    "pycountry>=24.6",
]

[project.optional-dependencies]
ml = [
    "torch",
    "transformers",
]

[dependency-groups]
dev = [
    "pandas-stubs~=3.1.0",
]

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"
